name: Dependency review

# pip-audit trong ci.yml quét TOÀN BỘ phụ thuộc đã resolve mỗi lần chạy; dependency-review-action
# chỉ soi PHẦN THÊM MỚI trong diff của PR trước khi merge (kèm license), nên chặn sớm hơn ở đúng
# PR gây ra thay đổi — không thay pip-audit, bổ sung điểm chặn khác.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
