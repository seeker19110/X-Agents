[project]
name = "keeper"
version = "0.1.0"
description = "Công ty bảo trì tự vận hành X-Agents: quan sát → triage → vá → verify → gate? → release, chỉ đọc GitHub"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "xagents-core",   # lõi chung (ADR gốc 0001); mã theo bảy bước K3.1-K3.7
]

[tool.uv.sources]
xagents-core = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keeper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/keeper"]
# Phủ NHÁNH, không chỉ dòng. `fail_under = 100` trên dòng vẫn để lọt nhánh chưa đi: đo 2026-09-09 cả sáu
# package xanh 100% dòng mà còn 198 nhánh chưa phủ. Với một repo mà sản phẩm chính là logic quyết định
# (guard, gate, fail-closed), nhánh mới là thứ đáng chặn. keeper đi trước vì khoảng cách nhỏ nhất (3).
branch = true

[tool.coverage.report]
# Cả năm package phủ 100% dòng VÀ nhánh (`branch = true` ở cả năm từ #366): ngưỡng bằng đúng mức đạt được, nên mất một dòng phủ là CI đỏ.
# Nhánh phụ thuộc môi trường (AF_INET6) được test bằng cách thay socket, không bằng môi trường.
fail_under = 100
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# `warn_unused_ignores` CỐ Ý không bật ở package này (gateway có, và giữ nguyên). Đo được
# 2026-09-07: nó báo 6 `# type: ignore` "thừa" mà phần lớn là PHỤ THUỘC NỀN (`ctypes.windll` của nhánh Windows,
# gỡ cùng mọi nhánh Windows ở ADR gốc 0031). Bật lại là việc riêng: đo lại số `# type: ignore` thừa trước.

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# E701/E702: cố ý viết gọn nhiều lệnh một dòng như software-company. RUF001-003: ký tự Unicode tiếng Việt trong comment.
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]
