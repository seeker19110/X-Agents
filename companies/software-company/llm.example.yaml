# Cấu hình model cho runner/eval. Sao chép thành `llm.yaml` (bị gitignore) hoặc dùng biến môi trường COMPANY_*.
# Framework trung lập provider: đổi model/provider ở đây, không đổi code hay prompt.
#
# BA TẦNG, tầng dưới làm nền cho tầng trên (ADR-0016 — `docs/adr/0016-cau-hinh-model-cap-may.md`):
#   1. tầng MÁY   ~/.config/xagents/llm.yaml  (đè bằng $XAGENTS_LLM_CONFIG) — thứ phụ thuộc máy này đang đăng
#                 nhập tài khoản nào: `backends` (tên, provider, config_dir, base_url). Nằm NGOÀI repo nên
#                 không bốc hơi theo `git worktree add`, và không bao giờ lọt vào git.
#   2. file này   thứ khác nhau thật giữa các công ty: routing, ngân sách, prices, sandbox, max_input_chars.
#   3. biến COMPANY_* thắng cả hai.
# Khoá nào đến từ tầng nào: `uv run python -m company.probe --explain` (thêm `--json` để so giữa hai máy).
# Trỏ $XAGENTS_LLM_CONFIG vào file không có = LỖI NGAY, không lặng lẽ rơi về `provider: fake`.

# anthropic | openai (mọi server OpenAI-compatible) | claude-code (CLI `claude -p`, gói Claude) | codex (CLI `codex exec`, gói ChatGPT) | fake
provider: openai

# model theo tier trong front matter agent
# strong = suy luận sâu/code; standard = việc có cấu trúc; light = việc cơ học, ngắn (thiếu light → dùng standard)
models:
  strong: qwen2.5-coder:32b     # ví dụ Ollama local; hoặc gpt-5, llama-3.3-70b, claude-opus-5...
  standard: qwen2.5-coder:7b
  light: qwen2.5-coder:7b

# chỉ provider openai: base URL của server. OpenAI thật: https://api.openai.com/v1
# Gateway xoay vòng tài khoản Antigravity (../gateway, `make setup` ghi sẵn): http://127.0.0.1:1123/v1
base_url: http://localhost:11434/v1
# api key đặt qua biến môi trường COMPANY_LLM_API_KEY (không ghi vào file)

max_tokens: 16000

# mức nỗ lực theo tier (low | medium | high | xhigh | max): anthropic (output_config), claude-code (`--effort`, ADR-0026),
# codex (model_reasoning_effort; thêm none/minimal). Tier không khai → provider dùng mặc định của nó.
effort:
  strong: high
  standard: medium
  light: low

# ADR-0026 — trần USD cho MỘT lượt gọi CLI `claude -p` (`--max-budget-usd`), cái hãm duy nhất có tác dụng GIỮA phiên.
# Bỏ trống thì dùng `budget_usd` (trần cả dự án) làm trần thảm hoạ; không có cả hai thì không đặt cờ.
# cli_max_budget_usd: 2.0

# tham số provider-specific truyền thẳng vào request (vd. temperature cho openai)
extra: {}

# --- ADR-0012 ---
# Thử lại lỗi transport (mạng, 408/409/429/5xx): số lần và giây cơ sở (chờ = base × 2^i + jitter, trần 30s).
# Lỗi nội dung (JSON hỏng, schema sai, model từ chối) KHÔNG retry. COMPANY_LLM_RETRIES ghi đè.
retries: 3
retry_base: 1.0

# Trần ký tự cho prompt (system + đầu vào + blackboard). Vượt thì runner cắt có nhãn (context.py).
# ≈ 37k token với 120000. COMPANY_MAX_INPUT_CHARS ghi đè.
max_input_chars: 120000

# TTL của breakpoint cache (chỉ provider `anthropic` hiểu). BỎ TRỐNG = mặc định 5 phút của Anthropic, và body
# request không mang khoá `ttl` nào — giống hệt trước p3.2. Chỉ nhận `5m` hoặc `1h`; viết sai thì hỏng to.
# `1h` giữ cache qua khoảng nghỉ dài nhưng GIÁ GHI GẤP ĐÔI (1.25x -> 2x): chỉ lãi khi cùng một tiền tố
# (bảng tool + system prompt của một agent) được đọc lại ít nhất ba lần trong giờ đó. Đo `cache_hit` trong
# audit trước khi bật. Đọc được cả ở cấp `backends:` — TTL là tính năng của provider, không của cả hệ.
# COMPANY_CACHE_TTL ghi đè.
# CHỈ provider `anthropic` đọc khoá này. Khai nó trên một backend openai-compat / codex / claude-code là vô
# hại nhưng KHÔNG có tác dụng và KHÔNG có cảnh báo — `apply_backend_yaml` nhận khoá cho mọi provider.
# cache_ttl: 1h

# Bảng giá USD / 1M token, khớp theo TIỀN TỐ tên model (không phân biệt hoa thường). Thiếu cached_input → input/10;
# thiếu cache_write → = input. Model không có trong bảng → cost_usd = 0 và bị đếm ở `unpriced_calls` (không phải miễn phí).
# Điền theo bảng giá hiện hành của provider; số dưới đây chỉ là ví dụ định dạng.
prices:
  claude-opus-5: {input: 15.0, output: 75.0, cached_input: 1.5, cache_write: 18.75}
  claude-sonnet-5: {input: 3.0, output: 15.0, cached_input: 0.3, cache_write: 3.75}
  gpt-5: {input: 1.25, output: 10.0, cached_input: 0.125}
  qwen2.5-coder: {input: 0.0, output: 0.0}   # local: 0 nhưng vẫn "có giá" để không bị đếm là unpriced

# Trần chi phí mỗi dự án (USD). Chạm 80% → supervisor warn; chạm 100% → pause dự án cho tới khi người `resume`.
# Bỏ trống = không giới hạn. COMPANY_BUDGET_USD ghi đè. Trần theo ticket đặt ở Task.budget_usd.
# budget_usd: 50.0
# Nợ kiến trúc treo (ADR-0032): cùng mã nợ (DEF-xx, SD-xx, `debt:`) nhắc ≥ n review liên tiếp của cùng nguồn → gate
# escalation cấp dự án. COMPANY_DEBT_REVIEWS ghi đè.
# debt_reviews: 3
# Sandbox tiến trình cho lệnh con của repo khách (ADR-0035). `auto` = dùng container nếu tìm thấy runtime trên PATH,
# không thì chạy subprocess như trước; `container` = BẮT BUỘC có container, thiếu binary thì lỗi chứ không tụt hạng
# bảo vệ; `subprocess` = tắt hẳn. Ba biến COMPANY_SANDBOX / COMPANY_SANDBOX_IMAGE / COMPANY_SANDBOX_RUNTIME ghi đè.
# sandbox: auto                       # auto | container | subprocess
# sandbox_image: python:3.12-slim     # image chạy lint/test/smoke của khách; phải có sẵn stack của repo khách
# sandbox_runtime: docker             # docker | podman | đường dẫn binary

# Tool web cho researcher bật bằng `orchestrator --web`; máy tìm kiếm qua biến môi trường COMPANY_SEARCH_URL
# (vd. SearXNG: http://searx.local/search?q={q}&format=json). Không đặt → DuckDuckGo HTML.

# --- ADR-0019: nhiều gói tài khoản subscription thay vì API trả theo token ---
# Khai `backends:` thì các khoá provider/models/base_url ở trên KHÔNG dùng nữa (chỉ retries/prices/max_input_chars/budget
# là dùng chung). Mỗi backend = một gói đang đăng nhập trên máy, có model riêng theo tier; thiếu tier nào thì backend đó
# dùng standard → strong. Thứ tự khai báo = thứ tự ưu tiên; `routing.prefer` ghi đè theo tier để tối ưu chi phí
# (việc nhẹ đi gói miễn phí, việc nặng đi gói mạnh). Hết quota → backend nghỉ `cooldown_s` (hoặc đúng Retry-After),
# lượt đó đi backend kế; lỗi mạng/5xx → nghỉ `transient_cooldown_s`. COMPANY_LLM_BACKENDS=a,b lọc/sắp lại khi chạy.
