[project]
name = "console"
version = "0.1.0"
description = "Console điều hành hợp nhất cho các công ty AI của X-Agents"
requires-python = ">=3.11"
# Không có phụ thuộc runtime ngoài BA công ty: server dùng thư viện chuẩn (http.server, sqlite3).
dependencies = [
    "keeper",
    "software-company",
]

[tool.uv.sources]
keeper = { workspace = true }
software-company = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# E701/E702: cùng quy ước viết gọn một dòng như hai công ty. RUF001-003: ký tự Unicode tiếng Việt.
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Cảnh báo là lỗi, như company: `ResourceWarning: unclosed database` trôi trong log console từ audit 2026-09-22 tới
# 2026-09-27 (B7) vì chỉ là một dòng "2 warnings". Ngoại lệ duy nhất: runpy cảnh báo khi test `__main__` chạy lại
# module đã import — đúng thứ `test_main.py` cố ý làm.
filterwarnings = [
    "error",
    "ignore:.*found in sys.modules after import of package.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/console"]

[tool.coverage.report]
# Cả năm package phủ 100% dòng (console đo DÒNG, không đo nhánh): ngưỡng bằng đúng mức đạt được, nên mất một dòng phủ là CI đỏ.
# Nhánh phụ thuộc nền tảng (os.name == "nt", AF_INET6) được test bằng cách thay socket/ctypes, không bằng môi trường.
fail_under = 100
